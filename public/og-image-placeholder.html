<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OG Image Generator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #ebeef8 0%, #fffceb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .container {
            text-align: center;
            padding: 60px;
        }
        .logo {
            font-size: 72px;
            font-weight: 900;
            color: #333;
            margin-bottom: 30px;
            letter-spacing: -2px;
        }
        .tagline {
            font-size: 36px;
            color: #555;
            margin-bottom: 20px;
            font-style: italic;
        }
        .subtitle {
            font-size: 24px;
            color: #666;
            font-weight: 300;
        }
        .badge {
            display: inline-block;
            padding: 12px 24px;
            background: #333;
            color: white;
            border-radius: 30px;
            margin-top: 30px;
            font-size: 18px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">INTIBA</div>
        <div class="tagline">Sinematik Mükemmellik</div>
        <div class="subtitle">Otelcilik & Yaşam Tarzı Video Prodüksiyon</div>
        <div class="badge">BODRUM</div>
    </div>
</body>
</html>
<!-- 
    Bu HTML'i screenshot alarak og-image.jpg olarak kaydedin.
    Boyut: 1200x630px (Facebook/Twitter için ideal)
-->
