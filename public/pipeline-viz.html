<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>intiba Pipeline — Skill Tree</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #07070c;
    --surface: #10101a;
    --surface2: #181828;
    --border: #252538;
    --text: #e4e4ef;
    --dim: #6a6a85;
    --accent: #6c5ce7;
    --green: #00d2a0;
    --amber: #f0a030;
    --red: #ff5555;
    --blue: #4dabf7;
    --cyan: #22d3ee;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden;
    height: 100vh;
  }

  /* ====== CANVAS (skill tree view) ====== */
  #canvas {
    width: 100vw;
    height: 100vh;
    position: relative;
    cursor: grab;
  }
  #canvas.grabbing { cursor: grabbing; }

  #world {
    position: absolute;
    transform-origin: 0 0;
    will-change: transform;
  }

  /* SVG edges */
  #edges {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    overflow: visible;
  }
  #edges line, #edges path {
    stroke: var(--border);
    stroke-width: 2;
    fill: none;
  }
  #edges .edge-done { stroke: var(--green); opacity: 0.5; }
  #edges .edge-skip { stroke: var(--red); opacity: 0.3; stroke-dasharray: 6 4; }
  #edges .edge-parallel { stroke: var(--accent); opacity: 0.4; stroke-dasharray: 4 4; }

  /* Animated particles on edges */
  .particle {
    fill: var(--accent);
    r: 3;
  }

  /* ====== NODE ====== */
  .node {
    position: absolute;
    width: 140px;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: transform 0.2s;
    z-index: 2;
  }
  .node:hover { transform: scale(1.08); z-index: 10; }

  .node-ring {
    width: 72px; height: 72px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    position: relative;
    transition: all 0.3s;
  }
  .node:hover .node-ring { box-shadow: 0 0 30px var(--accent); }

  /* Status rings */
  .node[data-status="done"] .node-ring {
    background: radial-gradient(circle at 30% 30%, #0a2a20, #0a0f0a);
    border: 2.5px solid var(--green);
    box-shadow: 0 0 15px #00d2a025;
  }
  .node[data-status="skip"] .node-ring {
    background: radial-gradient(circle at 30% 30%, #2a0a0a, #0f0a0a);
    border: 2.5px solid var(--red);
    opacity: 0.6;
    box-shadow: 0 0 15px #ff555515;
  }
  .node[data-status="code-gap"] .node-ring {
    background: radial-gradient(circle at 30% 30%, #2a1a0a, #0f0a0a);
    border: 2.5px solid var(--amber);
    box-shadow: 0 0 15px #f0a03015;
  }
  .node[data-status="input"] .node-ring {
    background: radial-gradient(circle at 30% 30%, #0a0a2a, #0a0a0f);
    border: 2.5px solid var(--blue);
    box-shadow: 0 0 15px #4dabf725;
  }
  .node[data-status="wait"] .node-ring {
    background: radial-gradient(circle at 30% 30%, #1a1a2a, #0a0a0f);
    border: 2.5px solid var(--dim);
    box-shadow: 0 0 10px #6a6a8515;
  }

  .node-label {
    margin-top: 8px;
    font-size: 0.72rem;
    font-weight: 600;
    text-align: center;
    line-height: 1.3;
    max-width: 130px;
    color: var(--text);
  }

  .node-sub {
    font-size: 0.62rem;
    color: var(--dim);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 2px;
  }

  /* Duration badge */
  .node-dur {
    position: absolute;
    bottom: -6px; right: -6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1px 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.55rem;
    color: var(--dim);
  }

  /* ====== DETAIL PANEL (slide-over) ====== */
  #panel {
    position: fixed;
    top: 0; right: 0;
    width: 420px;
    max-width: 90vw;
    height: 100vh;
    background: var(--surface);
    border-left: 1px solid var(--border);
    z-index: 100;
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    overflow-y: auto;
    padding: 0;
  }
  #panel.open { transform: translateX(0); }

  .panel-header {
    padding: 1.5rem;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .panel-close {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--dim);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .panel-close:hover { border-color: var(--text); color: var(--text); }

  .panel-icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
  }

  .panel-title { font-size: 1.1rem; font-weight: 600; }

  .panel-body { padding: 1.5rem; }

  .panel-section {
    margin-bottom: 1.5rem;
  }
  .panel-section-title {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--dim);
    margin-bottom: 0.6rem;
  }
  .panel-text {
    font-size: 0.88rem;
    line-height: 1.7;
    color: #b0b0c8;
  }
  .panel-text strong { color: var(--text); }
  .panel-text em { color: var(--accent); font-style: normal; }
  .panel-text .g { color: var(--green); }
  .panel-text .a { color: var(--amber); }
  .panel-text .r { color: var(--red); }

  .panel-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }
  .panel-tag {
    padding: 0.2rem 0.6rem;
    border-radius: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--dim);
  }
  .panel-tag.green { border-color: var(--green); color: var(--green); }
  .panel-tag.red { border-color: var(--red); color: var(--red); }
  .panel-tag.amber { border-color: var(--amber); color: var(--amber); }

  .panel-io {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 0.5rem;
    align-items: center;
  }
  .panel-io-col {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .panel-io-arrow { color: var(--accent); font-size: 1.2rem; text-align: center; }

  /* ====== LEGEND ====== */
  .legend {
    position: fixed;
    bottom: 1.5rem;
    left: 1.5rem;
    display: flex;
    gap: 1.2rem;
    z-index: 50;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.6rem 1.2rem;
    font-size: 0.7rem;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    color: var(--dim);
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 2px solid;
  }

  /* ====== MINIMAP ====== */
  .minimap {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    width: 180px;
    height: 120px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    z-index: 50;
    overflow: hidden;
  }
  .minimap-viewport {
    position: absolute;
    border: 1px solid var(--accent);
    background: var(--accent-glow);
    border-radius: 2px;
    pointer-events: none;
  }
  .minimap-dot {
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
  }

  /* ====== ZOOM CONTROLS ====== */
  .zoom-controls {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 0.3rem;
    z-index: 50;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.3rem;
  }
  .zoom-btn {
    width: 36px; height: 36px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--dim);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-family: inherit;
  }
  .zoom-btn:hover { background: var(--surface2); color: var(--text); }
  .zoom-label {
    padding: 0 0.5rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--dim);
    display: flex;
    align-items: center;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<div id="canvas">
  <div id="world">
    <svg id="edges" width="2000" height="1400"></svg>
  </div>
</div>

<div id="panel">
  <div class="panel-header">
    <button class="panel-close" onclick="closePanel()">✕</button>
    <div class="panel-icon" id="panelIcon"></div>
    <div>
      <div class="panel-title" id="panelTitle"></div>
      <div style="font-size:0.75rem;color:var(--dim)" id="panelSub"></div>
    </div>
  </div>
  <div class="panel-body" id="panelBody"></div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="border-color:var(--blue);background:var(--blue)30"></div> Girdi</div>
  <div class="legend-item"><div class="legend-dot" style="border-color:var(--green);background:var(--green)30"></div> Tamamlandı</div>
  <div class="legend-item"><div class="legend-dot" style="border-color:var(--amber);background:var(--amber)30"></div> Kod Eksik</div>
  <div class="legend-item"><div class="legend-dot" style="border-color:var(--red);background:var(--red)30"></div> Timeout</div>
  <div class="legend-item"><div class="legend-dot" style="border-color:var(--dim);background:var(--dim)30"></div> Bekleme</div>
</div>

<div class="zoom-controls">
  <button class="zoom-btn" onclick="zoomBy(-0.15)">−</button>
  <div class="zoom-label" id="zoomLabel">100%</div>
  <button class="zoom-btn" onclick="zoomBy(0.15)">+</button>
  <button class="zoom-btn" onclick="resetView()" style="font-size:0.7rem">FIT</button>
</div>

<script>
// ============================================================
// DATA
// ============================================================
const NODES = [
  // Row 0 — Input
  { id:'wizard', x:540, y:40, icon:'📝', label:'Website Wizard', sub:'16 soru + 5 aşama', status:'input', dur:'~8dk',
    detail: {
      narrative: `Tüccar kapıyı çalmış. Wizard 16 soru sormuş: ne yaptığını, rakiplerini, nerede olduğunu, dijital varlığını. Sonra 5 aşamalık sınav — operasyonel gerçeklik, marka ruhu, karakter, kim değiliz, hedef.`,
      inputs: [],
      outputs: ['wizard.answers','wizard.scores','wizard.stageResults','wizard.businessContext'],

    detail: {
      narrative: `Wizard cevaplarını yapılandırılmış <strong>NormalizedData</strong> objesine dönüştürür. İşletme adı, sektör, rakipler, marka olgunluğu (brandMaturity) çıkarır.`,
      inputs: ['wizard.answers','wizard.scores','wizard.businessContext'],

      highlight: `<span class="a">Çözüm:</span> Paralel Grup 1'e (strategist ile birlikte) eklenmeli.`

  // Row 9 — Final output
  { id:'firestore', x:440, y:1400, icon:'💾', label:'Firestore Kayıt', sub:'aiAnalysis', status:'done', dur:'<1s',
    detail: {
      narrative: `Tüm çıktılar <strong>aiAnalysis</strong> objesi olarak Firestore'daki lead dökümanına kaydedilir. ShareToken üretilip rapor paylaşılabilir hale gelir.`,
      inputs: ['analysis object'],
      outputs: ['Firestore doc','shareToken','rapor URL'],
      highlight: `<span class="g">Pipeline v4.0.0</span> — 9 agent çalıştı, 2 timeout, 1 kod eksikliği.`
    }
  },
];

// Edges: [from, to, class]
const EDGES = [
  ['wizard','normalizer','edge-done'],
  ['wizard','dr_start','edge-done'],
  ['wizard','web_fetch','edge-done'],
  ['normalizer','dr_poll',''],
  ['dr_start','dr_poll','edge-done'],
  ['dr_poll','research_ext','edge-done'],
  ['research_ext','strategist','edge-done'],
  ['research_ext','digital','edge-done'],
  ['normalizer','strategist','edge-done'],
  ['normalizer','digital','edge-done'],
  ['web_fetch','digital','edge-done'],
  ['strategist','challenger','edge-done'],
  ['strategist','blog','edge-done'],
  ['strategist','consumer','edge-done'],
  ['challenger','revision','edge-done'],
  ['consumer','revision','edge-done'],
  ['blog','synth','edge-done'],
  ['revision','synth','edge-done'],
  ['digital','synth','edge-done'],
  ['research_ext','synth','edge-done'],
  ['synth','evidence','edge-skip'],
  ['synth','firestore','edge-done'],
  ['synth','maximizer','edge-skip'],
  ['synth','competitor','edge-skip'],
  ['maximizer','firestore','edge-skip'],
  ['competitor','firestore','edge-skip'],
  ['evidence','firestore','edge-skip'],
  // Parallel indicators
  ['normalizer','dr_start','edge-parallel'],
  ['normalizer','web_fetch','edge-parallel'],
  ['challenger','blog','edge-parallel'],
  ['blog','consumer','edge-parallel'],
  ['strategist','digital','edge-parallel'],
];

// ============================================================
// RENDER
// ============================================================
const world = document.getElementById('world');
const edgesSvg = document.getElementById('edges');
let scale = 0.75, panX = 100, panY = 20;

// Create nodes
const nodeEls = {};
NODES.forEach(n => {
  const el = document.createElement('div');
  el.className = 'node';
  el.dataset.status = n.status;
  el.style.left = n.x + 'px';
  el.style.top = n.y + 'px';
  el.innerHTML = `
    <div class="node-ring">${n.icon}<div class="node-dur">${n.dur}</div></div>
    <div class="node-label">${n.label}</div>
    <div class="node-sub">${n.sub}</div>
  `;
  el.onclick = () => openPanel(n);
  world.appendChild(el);
  nodeEls[n.id] = { el, data: n };
});

// Draw edges
function getNodeCenter(id) {
  const n = NODES.find(n => n.id === id);
  return { x: n.x + 70, y: n.y + 36 };
}

const drawnPairs = new Set();
EDGES.forEach(([from, to, cls]) => {
  const pairKey = [from,to].sort().join('|');
  if (cls === 'edge-parallel') return; // don't draw parallel edges as separate lines
  if (drawnPairs.has(pairKey)) return;
  drawnPairs.add(pairKey);

  const a = getNodeCenter(from);
  const b = getNodeCenter(to);
  const line = document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1', a.x);
  line.setAttribute('y1', a.y);
  line.setAttribute('x2', b.x);
  line.setAttribute('y2', b.y);
  if (cls) line.setAttribute('class', cls);
  edgesSvg.appendChild(line);
});

// ============================================================
// PAN & ZOOM
// ============================================================
function applyTransform() {
  world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  document.getElementById('zoomLabel').textContent = Math.round(scale * 100) + '%';
}
applyTransform();

let dragging = false, dragStartX, dragStartY;
const canvas = document.getElementById('canvas');

canvas.addEventListener('pointerdown', e => {
  if (e.target.closest('.node') || e.target.closest('#panel')) return;
  dragging = true;
  dragStartX = e.clientX - panX;
  dragStartY = e.clientY - panY;
  canvas.classList.add('grabbing');
});
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  panX = e.clientX - dragStartX;
  panY = e.clientY - dragStartY;
  applyTransform();
});
window.addEventListener('pointerup', () => {
  dragging = false;
  canvas.classList.remove('grabbing');
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.08 : 0.08;
  scale = Math.max(0.3, Math.min(2, scale + delta));
  applyTransform();
}, { passive: false });

function zoomBy(d) { scale = Math.max(0.3, Math.min(2, scale + d)); applyTransform(); }
function resetView() { scale = 0.75; panX = 100; panY = 20; applyTransform(); }

// ============================================================
// DETAIL PANEL
// ============================================================
const panel = document.getElementById('panel');

function openPanel(n) {
  const d = n.detail;
  const statusColors = { done: 'var(--green)', skip: 'var(--red)', 'code-gap': 'var(--amber)', input: 'var(--blue)', wait: 'var(--dim)' };
  const col = statusColors[n.status];

  document.getElementById('panelIcon').style.background = col + '20';
  document.getElementById('panelIcon').style.border = '2px solid ' + col;
  document.getElementById('panelIcon').textContent = n.icon;
  document.getElementById('panelTitle').textContent = n.label;
  document.getElementById('panelSub').textContent = n.sub;

  let html = '';

  // Narrative
  html += `<div class="panel-section">
    <div class="panel-section-title">Hikaye</div>
    <div class="panel-text">${d.narrative}</div>
  </div>`;

  // I/O
  if (d.inputs.length || d.outputs.length) {
    html += `<div class="panel-section">
      <div class="panel-section-title">Veri Akışı</div>
      <div class="panel-io">
        <div class="panel-io-col">
          <div style="font-size:0.65rem;color:var(--dim);margin-bottom:0.3rem">GİRDİ</div>
          ${d.inputs.map(i => `<span class="panel-tag">${i}</span>`).join('')}
        </div>
        <div class="panel-io-arrow">→</div>
        <div class="panel-io-col">
          <div style="font-size:0.65rem;color:var(--dim);margin-bottom:0.3rem">ÇIKTI</div>
          ${d.outputs.map(o => `<span class="panel-tag green">${o}</span>`).join('')}
        </div>
      </div>
    </div>`;
  }

  // Highlight
  if (d.highlight) {
    html += `<div class="panel-section">
      <div class="panel-section-title">Dikkat</div>
      <div class="panel-text">${d.highlight}</div>
    </div>`;
  }

  document.getElementById('panelBody').innerHTML = html;
  panel.classList.add('open');
}

function closePanel() { panel.classList.remove('open'); }

// Close panel on ESC
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

// Close panel when clicking canvas background
canvas.addEventListener('click', e => {
  if (!e.target.closest('.node') && !e.target.closest('#panel')) closePanel();
});
</script>

</body>
</html>
